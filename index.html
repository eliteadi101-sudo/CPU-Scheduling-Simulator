<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU Scheduling Lab</title><link rel="stylesheet" href="style.css"></head><body><main><h1>⚙️ CPU Scheduling Lab</h1><p>Enter burst times in arrival order. Arrival time is 0 for every process.</p><section class="panel"><label>Burst times (comma-separated)<input id="bursts" value="5, 3, 8, 2"></label><label>Algorithm<select id="algorithm"><option value="fcfs">FCFS</option><option value="sjf">SJF (non-preemptive)</option><option value="rr">Round Robin</option></select></label><label id="quantum-wrap">Time quantum<input id="quantum" type="number" min="1" value="2"></label><button id="run">Simulate</button><p id="error" role="alert"></p></section><section class="panel"><h2>Gantt chart</h2><div id="gantt" class="gantt"></div><div id="ticks" class="ticks"></div></section><section class="panel"><h2>Process results</h2><div id="results"></div><div id="averages"></div></section></main><script src="app.js"></script></body></html>
